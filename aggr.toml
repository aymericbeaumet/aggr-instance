# aggr.aymericbeaumet.com — a reader built by https://github.com/aymericbeaumet/aggr
#
# Fork this repository for a working reader: edit this file, remove `url` below (or set your own
# domain), enable workflows in your fork's Actions tab and run "aggr" once. Every option is
# documented in https://github.com/aymericbeaumet/aggr/blob/main/config.default.toml

# Sources live in one file per topic; each file may set a `category` for all of its sources.
include = ["aggr-*.toml"]

[site]
title = "Aymeric's reads"
description = "Everything I follow, in one river."
timezone = "Europe/Paris"
url = "https://aggr.aymericbeaumet.com"

[digest]
at = "08:00"
