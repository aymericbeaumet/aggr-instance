<div id="readability-page-1" class="page"><div> <p>Amp now uses <a href="https://modelcontextprotocol.io/specification/2025-06-18/basic/transports#streamable-http">streamable HTTP transport</a> for MCP servers by default with a fallback to Server-Sent Events.</p>
<p>That allows you to connect to your own MCP servers hosted on <a href="https://blog.cloudflare.com/streamable-http-mcp-servers-python/">Cloudflare</a> or use other remote servers such as <code>https://learn.microsoft.com/api/mcp</code>.</p>
