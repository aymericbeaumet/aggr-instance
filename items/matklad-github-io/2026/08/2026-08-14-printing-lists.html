        <p>To print a comma-separated list, a concise idiom is to optionally print the comma first, before the element:</p>

        <figure>
          <pre><code>for (items, 0..) |item, item_index| {
    if (item_index &gt; 0) std.debug.print(", ");
    std.debug.print("{}", .{item});
}</code></pre>
